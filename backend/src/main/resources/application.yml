server:
  port: 8080

spring:
  application:
    name: face-privacy-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB
  datasource:
    url: jdbc:h2:file:./data/face-privacy;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

python-service:
  base-url: ${PYTHON_SERVICE_URL:http://localhost:8001}
  connect-timeout-ms: 2000
  read-timeout-seconds: 30
